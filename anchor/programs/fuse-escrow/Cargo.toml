[package]
name = "fuse-escrow"
version = "0.1.0"
description = "FUSE conditional workshop booking escrow proof of concept"
edition = "2021"
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "lib"]
name = "fuse_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
# Anchor's token-account init macro needs token_2022 helpers at compile time.
# Runtime contexts still pin Program<Token>, accepting ONLY the classic program.
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "=0.7.0"
solana-sdk = "=2.3.1"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "=0.22.1"
bincode = "=1.3.3"
